aid: lyte
name: Lyte
description: >-
  Lyte is a Mountain View, California perception company building an end-to-end integrated
  vision system for robotics and Physical AI. Founded in 2021 by Alexander Shpunt, Arman Hajati
  and Yuval Gerson — architects of Apple's depth-sensing and Face ID perception stack, and, in
  Shpunt's case, co-founder and CTO of PrimeSense — the company emerged from stealth in January
  2026 with $107M in aggregate funding from Fidelity Management & Research, Atreides Management,
  Exor Ventures, Key1 Capital, Avigdor Willenz's group and Venture Tech Alliance. Its flagship
  product, LyteVision, combines 4D sensing (distance plus velocity), RGB imaging and inertial
  motion awareness with custom silicon and software into a single plug-and-play perception
  platform for robots, mobility and next-generation automation; it won a CES 2026 Best of
  Innovation award in Robotics and was named an honoree in Vehicle Tech and Advanced Mobility.
  Lyte is collaborating with NVIDIA to stream perception into GPUs over Holoscan Sensor Bridge
  (zero-copy, Jetson Thor, CUDA, NITROS) and into Omniverse and Isaac Sim for real-time digital
  twins. Lyte ships hardware and an embedded perception stack rather than a developer platform,
  and publishes no public API, SDK, developer portal or machine-readable contract as of this
  profile.
